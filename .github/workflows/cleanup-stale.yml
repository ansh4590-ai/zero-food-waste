name: Scheduled Stale Task Cleanup (Vercel Hobby Compatibility)

on:
  schedule:
    # Runs every 10 minutes (compatible with GitHub Actions on free tier)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Stale Task Cleanup API
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          : "${APP_URL:?Set the APP_URL repository secret}"
          : "${CRON_SECRET:?Set the CRON_SECRET repository secret}"
          status=$(curl --silent --show-error --max-time 60 --write-out "%{http_code}" \
            --request POST "${APP_URL%/}/api/tasks/cleanup-stale" \
            --header "Authorization: Bearer ${CRON_SECRET}" --output /dev/null)
          if [ "$status" != 200 ]; then
            echo "Cleanup endpoint returned HTTP $status. Expected HTTP 200." >&2
            exit 1
          fi
